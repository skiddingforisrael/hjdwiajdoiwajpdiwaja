# These directives are loaded inside nginx's http block before the qstr.xyz
# virtual host. Cloudflare Tunnel is the only intended origin client.
map $http_cf_connecting_ip $cone_client_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone  $cone_client_key zone=cone_port_rate:10m rate=10r/m;
limit_conn_zone $cone_client_key zone=cone_client_connections:10m;
limit_conn_zone $server_name     zone=cone_total_connections:1m;
